services:
  rabbitmq:
    image: rabbitmq:4.1-management
    hostname: rabbitmq            # имя узла (rabbit@rabbitmq) должно быть постоянным, иначе данные в volume «потеряются»
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"     # AMQP — сюда подключаются pika, FastStream, Celery
      - "15672:15672"   # веб-интерфейс и HTTP API
      - "15692:15692"   # метрики Prometheus
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    build:
      context: .
      dockerfile_inline: |
        FROM postgres:17
        # wal2json — плагин логического декодирования: превращает WAL в JSON
        RUN apt-get update \
         && apt-get install -y --no-install-recommends postgresql-17-wal2json \
         && rm -rf /var/lib/apt/lists/*
    command:
      - postgres
      - -c
      - wal_level=logical             # в WAL пишется достаточно данных для логического декодирования
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
      - -c
      - max_slot_wal_keep_size=1GB    # если relay лежит долго, слот не съест весь диск
      - -c
      - output_plugin_libraries=pgoutput,test_decoding,wal2json  # сторонний плагин нужно разрешить явно
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data: